<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT School Application Form</title>
</head>

<body>

    <header id="top">
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="form.html">Application Form</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Sign in</h1>

            <p>
                Enter your email address and password to securely log in
                to AltSchool Student Portal.
            </p>

        <form>
            <div class="top-btn">
                <button>Sign up</button>
                <button>Sign in</button>
            </div>
            <fieldset>
                

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="john.doe@example.com"
                    required
                >
                <br>

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="********"
                    required
                >
                <br>

                <button type="submit">
                    Proceed to Dashboard
                </button>
            </fieldset>
        </form>

    <p>
        Forgot your password?
        <a href="#">Reset Now!</a>
    </p>

    <p>OR</p>

    <button type="button">
        Login with Google
    </button>
</section>

    </main>

    <footer>
        FHA Zuba, Abuja
        &copy; 2027
    </footer>

</body>

</html>
